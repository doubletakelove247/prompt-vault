<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>About Me</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Nikki</h1>

  <p>I'm a girl obsessed with AI that still uses an AOL email address.</p>

  <h2>Things I'm into</h2>
  <ul>
    <li>A big jug of water and a smokey old fashioned.</li>
    <li>Jamming out in my car with the music on full blast.</li>
    <li>A quiet cafe, a medium vanilla latte, and my laptop.</li>
  </ul>

  <h2>Prompt Vault</h2>

  <div id="settings-box">
    <label for="api-key-input">Anthropic API key</label>
    <input type="password" id="api-key-input" placeholder="sk-ant-...">
    <button id="save-key-button">Save Key</button>
    <span id="key-status"></span>
  </div>

  <input type="text" id="prompt-input" placeholder="Type a prompt...">
  <button id="add-button">Add</button>
  <input type="text" id="search-input" placeholder="Search prompts...">
  <ul id="prompt-list"></ul>

  <script src="script.js"></script>
</body>
</html>
